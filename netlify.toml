# The site lives in a subfolder. `base` points Netlify at it; `publish` and
# `functions` are relative to that base. This file overrides the UI settings.
[build]
  base = "siberia-exam-netlify/siberia-netlify"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Always fetch the latest page so cubs never get a stale copy.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
