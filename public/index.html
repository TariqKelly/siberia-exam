<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siberian Induction Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="pageStyle">
/* Layout: one exam column (max 760px) on a polar-night sky; sticky header holds the timer and a star-map of questions; the exam climbs floor by floor, Antarctic → Tundra → Arctic. Single committed dark look. */
:root{
  --night:#07112A; --night-2:#0B1838; --panel:#0E1F47; --panel-2:#13295B;
  --line:rgba(176,192,222,.15); --line-2:rgba(176,192,222,.32);
  --ice:#F4F7FC; --text:#E2E8F3; --muted:#93A1BB; --silver:#C4CCD9; --silver-d:#7B879D;
  --royal:#4C74F2; --royal-d:#2B4DA6; --flag-blue:#2C4EA8; --flag-navy:#16295A; --flag-white:#F5F7FB; --flag-dark:#0B1733;
  --ok:#93E0C2; --warn:#F2BD5A; --bad:#F2857A;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --foil:linear-gradient(100deg,#8E99AD 0%,#F5F7FB 18%,#A9B4C6 34%,#FFFFFF 48%,#93A0B6 64%,#E9EDF4 82%,#A2ADC0 100%);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#intro .wrap>*{min-width:0}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--silver);outline-offset:3px;border-radius:6px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
.mono{font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;font-size:11.5px}
.foil{background:var(--foil);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
@keyframes sheen{from{background-position:0% 0}to{background-position:-220% 0}}

/* ---------- INTRO ---------- */
#intro .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;padding-block:56px 64px;align-items:start}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--silver)}
.eyebrow svg{width:18px;height:18px}
.title{font-family:var(--f-display);font-weight:900;font-size:clamp(52px,8vw,108px);line-height:.86;letter-spacing:-.01em;text-transform:uppercase;margin:18px 0 18px;text-wrap:balance}
.lede{font-size:19px;max-width:30ch;color:var(--text);margin:0 0 28px}
.facts{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:34px}
.facts div{padding:12px 22px 12px 0;margin-right:22px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--ice)}
.facts span{color:var(--muted)}
.ladder{display:grid;gap:0;max-width:440px}
.floor{display:grid;grid-template-columns:64px 1fr;align-items:center;border-left:1px solid var(--line-2);padding:10px 0 10px 18px;position:relative}
.floor::before{content:"";position:absolute;left:-4px;top:50%;width:7px;height:7px;border-radius:50%;background:var(--silver-d);transform:translateY(-50%)}
.floor:last-child::before{background:var(--ice);box-shadow:0 0 0 4px rgba(244,247,252,.12)}
.floor .num{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--silver-d)}
.floor h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.floor p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ladder-note{color:var(--muted);font-size:14px;margin:12px 0 0 18px}
.panel{background:linear-gradient(180deg,rgba(19,41,91,.85),rgba(12,26,60,.92));border:1px solid var(--line);border-radius:4px;padding:28px;backdrop-filter:blur(6px);position:relative}
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--foil);background-size:200% 100%;animation:sheen 9s linear infinite}
.panel h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:26px;margin:0 0 14px;letter-spacing:.02em}
.rules{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:10px;counter-reset:r}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:15px;color:var(--text)}
.rules li::before{counter-increment:r;content:counter(r);font-family:var(--f-mono);font-size:12px;color:var(--silver-d);padding-top:3px}
.rules strong{color:var(--ice)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{color:var(--silver)}
.input{width:100%;background:rgba(7,17,42,.7);border:1px solid var(--line-2);border-radius:3px;padding:12px 14px;font-size:17px;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--silver);box-shadow:0 0 0 3px rgba(196,204,217,.15)}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:15px;margin:6px 0 20px;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--royal)}
.hold{position:relative;overflow:hidden;width:100%;padding:16px 20px;border-radius:3px;background:var(--ice);color:var(--night);font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.06em;--p:0;transition:transform .15s var(--ease),opacity .2s;user-select:none;-webkit-user-select:none;touch-action:none}
.hold::before{content:"";position:absolute;inset:0;background:var(--royal);transform-origin:left;transform:scaleX(var(--p));transition:transform var(--hold-ms,1000ms) linear}
.hold.holding::before{--p:1;transform:scaleX(1)}
.hold:not(.holding)::before{transition:transform .25s var(--ease)}
.hold span{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;gap:10px;transition:color .2s}
.hold.holding span{color:var(--ice)}
.hold:active{transform:scale(.99)}
.hold[disabled]{opacity:.35;cursor:not-allowed}
.hold-hint{color:var(--muted);font-size:13px;text-align:center;margin-top:8px}

/* ---------- EXAM ---------- */
#exam{min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,17,42,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-row{max-width:760px;margin:0 auto;padding:12px 20px 8px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:8px;color:var(--silver)}
.brand svg{width:16px;height:16px}
.sec-chip{flex:1;min-width:0;text-align:center;color:var(--ice);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-chip b{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;color:var(--ice);padding:4px 10px;border:1px solid var(--line-2);border-radius:3px;transition:color .3s,border-color .3s,background .3s}
.timer.warn{color:var(--warn);border-color:rgba(242,189,90,.5)}
.timer.crit{color:var(--bad);border-color:rgba(242,133,122,.6);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(242,133,122,.14)}}
.dots{max-width:760px;margin:0 auto;padding:4px 20px 12px;display:flex;gap:10px}
.dgroup{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;min-width:0}
.dot{height:14px;position:relative;display:grid;place-items:center;padding:0}
.dot i{width:6px;height:6px;border-radius:50%;background:rgba(176,192,222,.28);transition:transform .3s var(--ease),background .3s,box-shadow .3s}
.dot.partial i{background:var(--silver-d)}
.dot.done i{background:var(--ice);box-shadow:0 0 6px rgba(244,247,252,.6)}
.dot.flag i{background:var(--warn);box-shadow:0 0 6px rgba(242,189,90,.6)}
.dot.cur i{transform:scale(1.7);outline:1px solid var(--ice);outline-offset:2px}
.dot:hover i{transform:scale(1.5)}
.timebar{height:2px;background:rgba(176,192,222,.12)}
.timebar i{display:block;height:100%;background:var(--foil);background-size:200% 100%;transform-origin:left;transition:transform .9s linear}
main.stage{flex:1;max-width:760px;width:100%;margin:0 auto;padding:28px 20px 120px}
.qcard{position:relative}
.qcard.in{animation:qin .42s var(--ease) both}
.qcard.in.back{animation-name:qinb}
@keyframes qin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes qinb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--muted);margin-bottom:12px}
.qmeta .kind{color:var(--silver);border:1px solid var(--line-2);padding:3px 8px;border-radius:2px}
.qnum{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.8;color:transparent;-webkit-text-stroke:1px var(--silver-d);float:right;margin:-4px 0 0 16px;user-select:none}
.prompt{font-size:clamp(20px,3.2vw,25px);line-height:1.35;font-weight:700;color:var(--ice);margin:0 0 6px;text-wrap:pretty}
.help{color:var(--muted);margin:0 0 22px;font-size:15px}
.noselect{user-select:none;-webkit-user-select:none}

/* options */
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:13px 16px;border:1px solid var(--line-2);border-radius:3px;background:rgba(14,31,71,.55);transition:border-color .2s,background .2s,transform .15s var(--ease)}
.opt:hover{border-color:var(--silver-d);background:rgba(19,41,91,.75)}
.opt:active{transform:scale(.995)}
.opt .key{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:50%;font-family:var(--f-mono);font-size:12px;color:var(--silver);transition:all .25s var(--ease)}
.opt.multi .key{border-radius:3px}
.opt[aria-pressed="true"]{border-color:var(--ice);background:rgba(76,116,242,.18)}
.opt[aria-pressed="true"] .key{background:var(--ice);color:var(--night);border-color:var(--ice);transform:scale(1.08)}
.counter{margin-top:12px;color:var(--muted)}

.txt{max-width:420px}
.txt .input{font-size:20px;padding:14px 16px}

/* verdicts */
.verdicts{display:grid;gap:0;border-top:1px solid var(--line)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.vrow p{margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.seg button{padding:8px 14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);transition:background .2s,color .2s}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--ice);color:var(--night)}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.mcol{display:grid;gap:8px;align-content:start;min-width:0}
.mcol .mono{color:var(--muted);margin-bottom:2px}
.mitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line-2);border-radius:3px;background:rgba(14,31,71,.55);min-height:52px;transition:border-color .2s,background .2s,box-shadow .25s,opacity .2s}
.mitem:hover{border-color:var(--silver-d)}
.mitem.sel{border-color:var(--ice);box-shadow:0 0 0 3px rgba(244,247,252,.12);background:rgba(76,116,242,.2)}
.mitem .tag{font-family:var(--f-mono);font-size:12px;color:var(--silver);width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:50%}
.mitem.used{opacity:.55}
.mitem.used .tag{background:var(--silver-d);color:var(--night);border-color:var(--silver-d)}
.slot{min-width:34px;height:28px;padding:0 8px;display:inline-grid;place-items:center;border:1px dashed var(--line-2);border-radius:3px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--ice);background:var(--ice);color:var(--night);font-weight:600}
.pop{animation:pop .35s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}
.mitem svg{width:96px;height:auto;display:block;border-radius:2px}
.mlabel{min-width:0;font-size:15px;line-height:1.35}

/* order */
.order{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ord-item{display:grid;grid-template-columns:20px 34px 1fr auto;align-items:center;gap:8px;padding:10px 10px 10px 12px;border:1px solid var(--line-2);border-radius:3px;background:rgba(14,31,71,.7);cursor:grab;touch-action:none}
.ord-item.moved{animation:flash .5s var(--ease)}
@keyframes flash{30%{background:rgba(76,116,242,.3)}}
.grip{color:var(--silver-d);letter-spacing:-2px;font-size:14px}
.ord-pos{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--silver)}
.ord-btns{display:flex;gap:4px}
.ord-btns button{width:34px;height:34px;border:1px solid var(--line-2);border-radius:3px;color:var(--silver);transition:background .2s}
.ord-btns button:hover{background:rgba(244,247,252,.08)}
.sortable-ghost{opacity:.3}
.sortable-chosen{border-color:var(--ice);box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* cloze & ledger */
.cloze{font-size:20px;line-height:2.4;color:var(--ice);border-left:2px solid var(--silver-d);padding-left:18px;font-style:italic}
.blank{font:inherit;font-style:normal;font-size:17px;width:9.5em;max-width:100%;background:transparent;border:0;border-bottom:2px solid var(--silver-d);padding:2px 4px;color:var(--ice);text-align:center;transition:border-color .2s,background .2s}
.blank:focus{outline:none;border-color:var(--ice);background:rgba(244,247,252,.06)}
.ledger-wrap{overflow-x:auto}
.ledger{width:100%;border-collapse:collapse;font-size:16px;min-width:420px}
.ledger th{text-align:left;font-family:var(--f-mono);font-weight:400;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-2)}
.ledger td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ledger td:first-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--silver);white-space:nowrap;width:1%}
.ledger .blank{width:8em;font-size:16px}

/* sort */
.sorter{display:grid;gap:14px}
.pool,.bucket{min-height:64px;padding:12px;border:1px dashed var(--line-2);border-radius:3px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;transition:border-color .2s,background .2s}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bucket{border-style:solid;background:rgba(14,31,71,.5);min-height:150px;cursor:pointer}
.bucket.armed{border-color:var(--ice);background:rgba(76,116,242,.14)}
.bhead{width:100%;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.bhead b{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.chip{padding:7px 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--panel-2);font-size:14px;cursor:grab;transition:border-color .2s,background .2s,transform .2s var(--ease);touch-action:none}
.chip.sel{border-color:var(--ice);background:var(--royal-d);transform:translateY(-2px)}
.pool-empty{color:var(--muted);font-size:14px;align-self:center}

/* flags */
.flag-stage{display:grid;gap:14px;justify-items:start}
.flag-stage svg{width:100%;max-width:520px;height:auto;display:block;box-shadow:0 18px 50px rgba(0,0,0,.45);border-radius:2px}
.hit{cursor:pointer;transition:filter .25s}
.hit:hover{filter:brightness(1.12)}
.hit.sel{filter:drop-shadow(0 0 0 #F2BD5A) drop-shadow(0 0 6px #F2BD5A)}
.hit:focus{outline:none}
.hit:focus-visible{filter:drop-shadow(0 0 4px #C4CCD9)}
.marked{color:var(--muted)}
.marked b{color:var(--warn);font-weight:700}
.builder{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.builder svg{width:100%;height:auto;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.builder svg *{transition:fill .35s var(--ease),opacity .35s,transform .45s var(--ease)}
.ctrl{display:grid;gap:6px;margin-bottom:14px}
.ctrl .mono{color:var(--muted)}
.ctrl .seg{flex-wrap:wrap}
.ctrl .seg button{padding:8px 10px;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:14px}

/* footer nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(7,17,42,.9);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-row{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center}
.btn{padding:12px 18px;border:1px solid var(--line-2);border-radius:3px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s,transform .12s}
.btn:hover{background:rgba(244,247,252,.06);border-color:var(--silver-d)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ice);color:var(--night);border-color:var(--ice)}
.btn.primary:hover{background:#fff}
.btn[disabled]{opacity:.3;pointer-events:none}
.btn.flagged{border-color:var(--warn);color:var(--warn)}
.spacer{flex:1}
.btn svg{width:16px;height:16px}

/* overlays */
.veil{position:fixed;inset:0;z-index:20;background:rgba(4,10,26,.82);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.inter{text-align:center;max-width:560px}
.inter .mono{color:var(--silver)}
.inter h2{font-family:var(--f-display);font-weight:900;font-size:clamp(72px,16vw,150px);line-height:.85;text-transform:uppercase;margin:12px 0 10px;animation:rise .9s var(--ease) both .1s}
.inter p{color:var(--text);font-size:18px;margin:0;animation:rise .9s var(--ease) both .25s}
.inter .tap{display:block;margin-top:26px;color:var(--muted);animation:rise .9s var(--ease) both .5s}
@keyframes rise{from{opacity:0;transform:translateY(18px);letter-spacing:.12em}}
.sheet{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--night-2);border:1px solid var(--line-2);border-radius:4px;padding:24px;animation:up .4s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.sheet h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:28px;margin:0 0 4px}
.sheet .sub{color:var(--muted);margin:0 0 18px}
.grid-sec{margin-bottom:16px}
.grid-sec .mono{color:var(--silver);margin-bottom:8px;display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.tile{height:42px;border:1px solid var(--line-2);border-radius:3px;font-family:var(--f-mono);font-size:13px;color:var(--muted);position:relative;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile.done{background:var(--ice);color:var(--night);border-color:var(--ice)}
.tile.partial{background:rgba(196,204,217,.25);color:var(--ice)}
.tile.flag::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.tile.cur{outline:2px solid var(--royal);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:13px;margin:4px 0 18px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line-2)}
.warnbox{border:1px solid rgba(242,189,90,.4);background:rgba(242,189,90,.08);color:var(--text);padding:12px 14px;border-radius:3px;margin-bottom:16px;font-size:15px}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet-actions .hold{flex:1;min-width:220px;font-size:20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:var(--warn);color:var(--night);padding:10px 16px;border-radius:3px;font-weight:700;font-size:14px;animation:toast 4s var(--ease) both;max-width:calc(100% - 32px);text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.timeup h2{font-family:var(--f-display);font-weight:900;font-size:clamp(64px,14vw,130px);text-transform:uppercase;line-height:.9;margin:0;text-align:center}
.timeup p{text-align:center;color:var(--muted)}

/* ---------- RESULTS ---------- */
#results .wrap{max-width:880px;padding-block:44px 64px}
.r-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--silver)}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ice);border:1px solid var(--line-2);padding:6px 10px;border-radius:3px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.r-hero{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:center;margin:26px 0 8px}
.r-name{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.4vw,40px);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1;color:var(--ice);word-break:break-word}
.r-score{font-family:var(--f-display);font-weight:900;font-size:clamp(120px,24vw,232px);line-height:.8;margin:14px 0 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.r-score small{font-size:.38em;margin-left:4px}
.r-pts{color:var(--muted);margin:14px 0 0}
.constel{width:100%;height:auto;overflow:visible}
.constel .ln{fill:none;stroke:var(--silver);stroke-width:1.2;stroke-dasharray:600;stroke-dashoffset:600;opacity:.75}
.constel.go .ln{animation:draw 2.4s var(--ease) forwards .2s}
@keyframes draw{to{stroke-dashoffset:0}}
.constel .st{fill:var(--ice);transform-box:fill-box;transform-origin:center;transform:scale(0)}
.constel.go .st{animation:popstar .6s var(--ease) forwards}
@keyframes popstar{60%{transform:scale(1.5)}100%{transform:scale(1)}}
.constel .lbl{fill:var(--muted);font-family:var(--f-mono);font-size:7px;letter-spacing:.06em;opacity:0;transition:opacity .6s}
.constel.go .lbl{opacity:1;transition-delay:2.6s}
.fail .constel .st{fill:var(--silver-d)}
.verdict{margin:30px 0 26px;padding:22px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;opacity:0;transform:scale(1.25);filter:blur(6px)}
.verdict.go{animation:stamp .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{to{opacity:1;transform:none;filter:none}}
.verdict svg{width:72px;height:72px}
.verdict h2{font-family:var(--f-display);font-weight:900;font-size:clamp(36px,6.4vw,64px);line-height:.9;text-transform:uppercase;margin:0;letter-spacing:.01em}
.verdict p{margin:6px 0 0;color:var(--text)}
.pass .verdict h2{color:var(--ice)}
.fail .verdict h2{color:var(--bad)}
.r-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:32px}
.secs{display:grid;gap:14px}
.secrow{display:grid;gap:6px}
.secrow .top{display:flex;justify-content:space-between;align-items:baseline}
.secrow b{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.secrow .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--silver);font-size:14px}
.track{height:8px;background:rgba(176,192,222,.12);position:relative;border-radius:1px}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--foil);background-size:200% 100%;transition:width 1.4s var(--ease)}
.track .mark{position:absolute;top:-4px;bottom:-4px;left:85%;width:1px;background:var(--warn)}
.facts2{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.facts2 div{padding:12px 0;border-bottom:1px solid var(--line)}
.facts2 div:nth-child(odd){padding-right:12px}
.facts2 dt{color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.facts2 dd{margin:2px 0 0;font-size:17px;color:var(--ice);font-variant-numeric:tabular-nums;word-break:break-word}
.facts2 dd.alert{color:var(--warn)}
.showinv{margin-top:34px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px 20px;border:1px solid var(--ice);border-radius:3px;background:rgba(244,247,252,.06)}
.showinv svg{width:34px;height:34px}
.showinv strong{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.03em;color:var(--ice)}
.showinv span{color:var(--text)}
.reset{margin-top:40px;max-width:360px}
.reset .hold{background:transparent;color:var(--muted);border:1px solid var(--line-2);font-size:15px;padding:12px 14px;font-family:var(--f-mono);letter-spacing:.08em}
.reset .hold::before{background:var(--bad)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.on{opacity:1;transform:none}
#burst{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

/* ---------- gate ---------- */
.gate-q{margin:0 0 2px;color:var(--ice);font-weight:700;font-size:16px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hold-hint.bad{color:var(--bad)}
.linkbtn{color:var(--ice);text-decoration:underline;padding:0;font:inherit}
#crest{cursor:default;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

/* ---------- ADMIN ---------- */
.adm-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(7,17,42,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.adm-bar-row{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.adm-title{display:grid;line-height:1.1}
.adm-title .mono{color:var(--warn)}
.adm-title b{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.adm-meta{color:var(--muted)}
.adm-status{font-size:14px;color:var(--muted)}
.adm-status.dirty{color:var(--warn)}
.adm-status.ok{color:var(--ok)}
.adm-status.bad{color:var(--bad)}
.adm-main{max-width:980px;margin:0 auto;padding:24px 20px 80px;display:grid;gap:22px}
.adm-card{border:1px solid var(--line-2);border-radius:3px;padding:20px;background:rgba(14,31,71,.55)}
.adm-h{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:22px;letter-spacing:.02em;margin:0}
.adm-note{color:var(--muted);margin:2px 0 14px;font-size:14px}
.adm-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);overflow-x:auto}
.adm-tabs button{padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:baseline}
.adm-tabs button b{font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.adm-tabs button[aria-selected="true"]{color:var(--ice);border-color:var(--ice)}
.qrow{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid var(--line);transition:background .2s}
.qrow.open{background:rgba(19,41,91,.45)}
.qrow.bad .qn{color:var(--bad)}
.qhead{display:grid;grid-template-columns:40px 1fr 20px;gap:12px;align-items:center;text-align:left;padding:14px 8px 14px 4px;min-width:0}
.qn{color:var(--silver-d);font-size:13px}
.qtxt{display:grid;gap:3px;min-width:0}
.qtype{color:var(--silver);font-size:10.5px}
.ptxt{color:var(--ice);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chev{color:var(--muted);transition:transform .25s var(--ease)}
.qrow.open .chev{transform:rotate(180deg)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:3px;margin-right:8px}
.stepper button{width:32px;height:34px;color:var(--silver);font-size:18px}
.stepper button:hover{background:rgba(244,247,252,.08)}
.stepper .pv{min-width:58px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ice)}
.qed{grid-column:1/-1;padding:4px 16px 22px 56px;display:grid;gap:16px;animation:fade .25s}
.ed-grid{display:grid;gap:12px}
.ed-f{display:grid;gap:5px;min-width:0}
.ed-f>.mono,.lab{color:var(--muted)}
.ed-row2{display:grid;grid-template-columns:1fr 140px;gap:12px}
.ed-row2.wide{grid-template-columns:1fr 1fr}
.qed .input,.adm-card .input{font-size:15px;padding:9px 11px}
textarea.input{resize:vertical;line-height:1.45;font-family:var(--f-body)}
textarea.input.code{font-family:var(--f-mono);font-size:13.5px}
select.input{appearance:auto}
.ed-type{display:grid;gap:8px;border-top:1px dashed var(--line-2);padding-top:14px}
.optrow{display:grid;grid-template-columns:28px 1fr 34px;gap:8px;align-items:center}
.optrow.pair{grid-template-columns:1fr 18px 1fr 34px}
.optrow.vrow2{grid-template-columns:1fr auto 34px}
.optrow input[type=radio],.optrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);justify-self:center}
.x{width:34px;height:34px;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-size:18px}
.x:hover{color:var(--bad);border-color:var(--bad)}
.arrow{color:var(--muted);text-align:center}
.addbtn{justify-self:start;padding:8px 12px;border:1px dashed var(--line-2);border-radius:3px;color:var(--silver);font-size:14px}
.addbtn:hover{border-color:var(--silver);color:var(--ice)}
.inline-check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text)}
.inline-check input{width:18px;height:18px;accent-color:var(--royal)}
.ed-help{color:var(--muted);font-size:13.5px;margin:0}
.ed-help code{font-family:var(--f-mono);color:var(--silver);font-size:12.5px}
.ed-err{color:var(--bad);margin:0;font-size:14px}
.ed-err:empty{display:none}
.ed-foot{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.danger{color:var(--bad);border-color:rgba(242,133,122,.4)}
.btn.danger.armed{background:var(--bad);color:var(--night)}
.ed-flag{max-width:340px}
.ed-flag svg{width:100%;height:auto;display:block;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-add{display:grid;gap:10px}
.typepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;animation:fade .25s}
.typepick button{text-align:left;padding:10px 12px;border:1px solid var(--line-2);border-radius:3px;background:rgba(14,31,71,.6);font-size:14px}
.typepick button:hover{border-color:var(--ice)}
.typepick button small{display:block;color:var(--muted);font-size:12.5px}
.adm-danger .hold{background:transparent;color:var(--muted);border:1px solid var(--line-2);font-size:15px;font-family:var(--f-mono);letter-spacing:.06em}
.adm-danger .hold::before{background:var(--bad)}
.adm-empty{color:var(--muted);padding:18px 4px}
@media (max-width:620px){
  .qed{padding:4px 12px 20px}
  .ed-row2,.ed-row2.wide,.twocol{grid-template-columns:1fr}
  .optrow.pair{grid-template-columns:1fr 34px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .optrow.pair>:first-child{grid-column:1/-1}
  .optrow.pair .arrow{display:none}
  .adm-bar-row{gap:8px;padding-block:10px}
  .adm-title b{font-size:20px}
  .adm-bar-row .btn{padding:9px 12px;font-size:14px}
  .adm-status{order:9;width:100%;font-size:13px}
  .adm-meta{display:none}
  .adm-main{padding-inline:16px}
  .adm-bar-row{padding-inline:16px}
}

@media (max-width:860px){
  #intro .wrap{grid-template-columns:1fr;gap:36px;padding-block:36px 48px}
  .r-hero{grid-template-columns:1fr}
  .r-hero .constel{max-width:300px}
  .r-grid{grid-template-columns:1fr}
}
@media (max-width:620px){
  .match{grid-template-columns:1fr}
  .builder{grid-template-columns:1fr}
  .buckets{grid-template-columns:1fr}
  .qnum{font-size:44px}
  .brand span{display:none}
  .nav-row .btn .lbl{display:none}
  .nav-row .btn.primary .lbl{display:inline}
  .vrow{grid-template-columns:1fr}
  .wrap{padding-inline:16px}
  .bar-row,.dots,main.stage,.nav-row{padding-inline:16px}
  .panel{padding:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
}
</style>

</head>
<body>
<template id="pageMarkup">
<canvas id="sky" aria-hidden="true"></canvas>

<!-- INTRO -->
<section id="intro" class="screen">
  <div class="wrap">
    <div>
      <div class="eyebrow mono" id="crest"><svg viewBox="0 0 40 40" aria-hidden="true"><polygon id="logoStar" fill="currentColor"/></svg>The Great Republic of Siberia</div>
      <h1 class="title"><span class="foil">Induction</span><br><span class="foil">Examination</span></h1>
      <p class="lede">This exam decides whether you are eligible for Final Night. Show what you know about the Republic.</p>
      <div class="facts">
        <div><b id="fQ">42</b><span class="mono">Questions</span></div>
        <div><b>30:00</b><span class="mono">Minutes</span></div>
        <div><b>85%</b><span class="mono">To pass</span></div>
      </div>
      <div class="ladder" aria-label="Exam sections">
        <div class="floor"><span class="num">III</span><div><h3>Arctic</h3><p>Flags and the northern sky</p></div></div>
        <div class="floor"><span class="num">II</span><div><h3>Tundra</h3><p>History and leadership</p></div></div>
        <div class="floor"><span class="num">I</span><div><h3>Antarctic</h3><p>Language, values and government</p></div></div>
      </div>
      <p class="ladder-note">You start on the first floor and climb to the Arctic.</p>
    </div>
    <div class="panel">
      <h2>Rules of the room</h2>
      <ol class="rules">
        <li><span><strong>No outside help.</strong> No phones, notes, other tabs or talking. An invigilator is watching for the full 30 minutes.</span></li>
        <li><span><strong>Leaving this window is recorded.</strong> Each time you switch away, it is counted and shown on your result.</span></li>
        <li><span>The clock starts when you begin and <strong>submits automatically</strong> at 00:00.</span></li>
        <li><span>Move between questions freely. Flag any you want to revisit. Answers can change until you submit.</span></li>
        <li><span>Questions with several parts earn partial credit. Wrong picks in "select all" questions cost marks.</span></li>

      </ol>
      <form id="startForm" autocomplete="off">
        <div class="field"><label class="mono" for="cubName">Cub name</label><input class="input" id="cubName" required maxlength="60" placeholder="Full name"></div>

        <label class="check" for="honour"><input type="checkbox" id="honour"><span>I will answer alone, from memory, without any outside help.</span></label>
        <button type="button" class="hold" id="beginBtn" disabled style="--hold-ms:1100ms"><span>Hold to begin</span></button>
        <p class="hold-hint" id="beginHint">Enter your name and the password, and tick the box to unlock.</p>
      </form>
    </div>
  </div>
</section>

<!-- EXAM -->
<section id="exam" class="screen" hidden>
  <header class="bar">
    <div class="bar-row">
      <div class="brand mono"><svg viewBox="0 0 40 40" aria-hidden="true"><polygon class="logoStar" fill="currentColor"/></svg><span>Siberia</span></div>

      <div class="timer" id="timer" role="timer" aria-live="off">30:00</div>

      <button class="btn" id="flagBtn" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 14V2.5h8l-1.5 3L11 8.5H3"/></svg><span class="lbl">Flag</span></button>
      <button class="btn" id="mapBtn"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="3" r="1.6"/><circle cx="8" cy="3" r="1.6"/><circle cx="13" cy="3" r="1.6"/><circle cx="3" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="13" cy="8" r="1.6"/><circle cx="3" cy="13" r="1.6"/><circle cx="8" cy="13" r="1.6"/><circle cx="13" cy="13" r="1.6"/></svg><span class="lbl">Review</span></button>
      <span class="spacer"></span>
      <button class="btn primary" id="nextBtn"><span class="lbl">Next</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
  </nav>
</section>

<!-- RESULTS -->
<section id="results" class="screen" hidden>
  <div class="wrap" id="rwrap">
    <div class="r-top"><span class="mono">Induction Examination · Official result</span><span class="live" title="This clock keeps running, so a photo of an old result will not match"><i></i><span id="liveClock">--:--:--</span></span></div>
    <div class="r-hero">
      <div>
        <p class="r-name" id="rName"></p>
        <p class="r-score"><span class="foil" id="rScore">0</span><small class="foil">%</small></p>
        <p class="r-pts" id="rPts"></p>
      </div>
      <svg class="constel" id="constel" viewBox="0 0 300 160" aria-hidden="true"></svg>

    <div class="verdict" id="verdict"></div>

      <div class="secs" id="rSecs"></div>
      <dl class="facts2" id="rFacts"></dl>

    <div class="showinv reveal" id="showinv">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="4" width="22" height="32" rx="3"/><path d="M17 31h6"/><path d="M14 16l4 4 8-8" stroke="#93E0C2"/></svg>
      <div><strong>Show this screen to your invigilator</strong><span>Stay seated and keep this page open until a Bear has recorded your result.</span></div>
    </div>
    <div class="reset reveal" id="resetWrap">
      <button class="hold" id="resetBtn" style="--hold-ms:2500ms"><span>Invigilator · hold to reset for next cub</span></button>
    </div>

<!-- QUESTION BANK (owner only) -->
<section id="admin" class="screen" hidden>
  <header class="adm-bar">

  </header>
  <main class="adm-main">
    <section class="adm-card">

    <nav class="adm-tabs" id="admTabs" role="tablist"></nav>
    <div id="admList"></div>
    <div class="adm-add" id="admAdd"></div>

      <h2 class="adm-h">Start over</h2>

      <button class="hold" id="admRestore" style="--hold-ms:1800ms;max-width:420px"><span>Hold to restore the original bank</span></button>
    </section>
  </main>
</section>
<canvas id="burst" aria-hidden="true" hidden></canvas>
</template>


<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script id="pageScript">
(function(){
"use strict";
/* mount the page markup (kept in a template so the page can republish itself from clean source) */

/* ================= DEFAULT QUESTION BANK ================= */

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=n=>Array.from({length:n},(_,i)=>i);
function derange(n){if(n<2)return range(n);let p;do{p=shuffle(range(n))}while(p.some((v,i)=>v===i));return p}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function lev(a,b){const m=a.length,n=b.length;const d=range(n+1);for(let i=1;i<=m;i++){let prev=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return d[n]}
function textOK(v,accept,tol){const x=norm(v);if(!x)return false;return (accept||[]).some(a=>{const y=norm(a);return y&&(x===y||(tol&&y.length>=6&&lev(x,y)<=1))})}
function blanks(q){if(q.t==='cloze')return (q.parts||[]).filter(p=>typeof p==='object');return (q.rows||[]).flatMap(r=>r[1].filter(p=>typeof p==='object'))}

/* ================= GRADING ================= */
function grade(q,a){
  switch(q.t){
    case 'mcq':return a===q.a?1:0;
    case 'multi':{if(!a||!a.length||!q.a.length)return 0;let hit=0,fp=0;a.forEach(i=>q.a.includes(i)?hit++:fp++);return Math.max(0,(hit-fp)/q.a.length)}
    case 'typed':return textOK(a,q.accept,q.tol)?1:0;
    case 'number':return a!==undefined&&String(a).trim()!==''&&Number(a)===Number(q.a)?1:0;
    case 'verdicts':{if(!a)return 0;let c=0;q.items.forEach((it,i)=>{if(a[i]===it.a)c++});return c/q.items.length}
    case 'match':{if(!a)return 0;let c=0;q.left.forEach(l=>{if(a[l.id]===l.a)c++});return c/q.left.length}
    case 'order':{const o=a||S.perm[q.id]||[];let c=0;o.forEach((v,i)=>{if(v===i)c++});return c/q.items.length}
    case 'cloze':case 'ledger':{if(!a)return 0;const bl=blanks(q);let c=0;bl.forEach((b,i)=>{if(textOK(a[i],b.b,b.tol||q.tol))c++});return bl.length?c/bl.length:0}
    case 'sort':{if(!a)return 0;let c=0;q.items.forEach((it,i)=>{if(a[i]===it[1])c++});return c/q.items.length}
    case 'forgery':return a===forgeOf(q).hit?1:0;
    case 'builder':{if(!a)return 0;return Object.keys(q.a).every(k=>a[k]===q.a[k])?1:0}
  }
  return 0;
}
function status(q){
  const a=S.ans[q.id];
  if(a===undefined||a===null)return 'none';
  switch(q.t){
    case 'multi':return a.length?'done':'none';
    case 'typed':case 'number':return String(a).trim()?'done':'none';
    case 'verdicts':{const n=Object.keys(a).length;return n===q.items.length?'done':n?'partial':'none'}
    case 'match':{const n=Object.keys(a).length;return n===q.left.length?'done':n?'partial':'none'}
    case 'cloze':case 'ledger':{const n=Object.values(a).filter(v=>v&&String(v).trim()).length;return n===blanks(q).length?'done':n?'partial':'none'}
    case 'sort':{const n=Object.keys(a).length;return n===q.items.length?'done':n?'partial':'none'}
    case 'builder':{const n=Object.keys(a).length;return n===BCTRL.length?'done':n?'partial':'none'}
  }
  return 'done';
}

/* ================= SKY ================= */
const sky=document.getElementById('sky'),sctx=sky.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let stars=[];
function sizeSky(){const d=Math.min(devicePixelRatio||1,2);sky.width=innerWidth*d;sky.height=innerHeight*d;sctx.setTransform(d,0,0,d,0,0);
  const n=Math.round(innerWidth*innerHeight/9000);stars=range(n).map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.1+.2,p:Math.random()*Math.PI*2,s:.4+Math.random()*1.2}));drawSky(0)}
function drawSky(t){
  const w=innerWidth,h=innerHeight;sctx.clearRect(0,0,w,h);
  const grd=sctx.createRadialGradient(w*.8,-h*.1,0,w*.8,-h*.1,h*1.2);grd.addColorStop(0,'rgba(60,96,200,.28)');grd.addColorStop(1,'rgba(7,17,42,0)');sctx.fillStyle=grd;sctx.fillRect(0,0,w,h);
  for(const s of stars){const a=.25+.55*(.5+.5*Math.sin(s.p+t*.001*s.s));sctx.globalAlpha=a;sctx.fillStyle='#E8EEF8';sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,7);sctx.fill()}
  sctx.globalAlpha=1;
}
function skyLoop(t){drawSky(t);requestAnimationFrame(skyLoop)}
addEventListener('resize',sizeSky);sizeSky();if(!reduce)requestAnimationFrame(skyLoop);

/* ================= HOLD BUTTONS ================= */
function holdable(btn,ms,done){
  let t=null;
  const start=e=>{if(btn.disabled)return;if(e.type==='keydown'){if(e.repeat||(e.key!==' '&&e.key!=='Enter'))return;e.preventDefault()}btn.classList.add('holding');clearTimeout(t);t=setTimeout(()=>{btn.classList.remove('holding');done()},reduce?150:ms)};
  const stop=()=>{clearTimeout(t);btn.classList.remove('holding')};
  btn.addEventListener('pointerdown',start);btn.addEventListener('keydown',start);
  ['pointerup','pointerleave','pointercancel','keyup','blur'].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener('click',e=>e.preventDefault());
}

/* ================= INTRO ================= */
const $=id=>document.getElementById(id);
const cubName=$('cubName'),gateAns=$('gateAns'),honour=$('honour'),beginBtn=$('beginBtn');
function refreshIntro(){$('fQ').textContent=Q.length;$('gateQ').textContent=BANK.gate.q}
let bankState='loading'; // loading | ready | error
function checkStart(){
  const ok=bankState==='ready'&&cubName.value.trim()&&gateAns.value.trim()&&honour.checked;beginBtn.disabled=!ok;
  const h=$('beginHint');h.classList.remove('bad');
  if(bankState==='loading'){h.textContent='Loading the latest questions…';return}
  if(bankState==='error'){h.classList.add('bad');h.innerHTML='Could not reach the exam server. Check the connection, then <button type="button" class="linkbtn" id="retryBank">try again</button>.';$('retryBank').addEventListener('click',()=>loadBank());return}
  h.textContent=ok?'Press and hold. The clock starts immediately.':'Enter your name and the password, and tick the box to unlock.';
}
[cubName,gateAns,honour].forEach(el=>el.addEventListener('input',checkStart));honour.addEventListener('change',checkStart);
$('startForm').addEventListener('submit',e=>e.preventDefault());
let starting=false;
holdable(beginBtn,1100,async()=>{
  if(starting)return;starting=true;
  await loadBank(true); // pick up any edit saved since this screen opened
  starting=false;
  if(bankState!=='ready')return;
  if(!textOK(gateAns.value,BANK.gate.accept,0)){
    const f=$('gateField');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
    const h=$('beginHint');h.classList.add('bad');h.textContent='That password is wrong. The exam stays locked.';gateAns.focus();gateAns.select();return;
  }
  startExam();
});

function startExam(){
  S=fresh();S.name=cubName.value.trim();
  S.bank=clone(BANK.questions);useQ(S.bank);
  S.order=SEC_ORDER.flatMap(s=>shuffle(Q.filter(q=>q.s===s).map(q=>q.id)));
  Q.forEach(q=>{
    if(q.t==='mcq'||q.t==='multi')S.perm[q.id]=shuffle(range(q.o.length));
    if(q.t==='match')S.perm[q.id]=shuffle(q.right.map(r=>r.id));
    if(q.t==='order')S.perm[q.id]=derange(q.items.length);
    if(q.t==='sort')S.perm[q.id]=shuffle(range(q.items.length));
  });
  S.phase='exam';S.startAt=Date.now();S.cur=0;save();
  enterExam(true);
}

/* ================= EXAM ================= */
let tick=null;
function enterExam(isNew){
  $('intro').hidden=true;$('results').hidden=true;$('admin').hidden=true;$('exam').hidden=false;scrollTo(0,0);
  buildDots();
  showQ(S.cur,1,true);
  if(isNew)interstitial(QM[S.order[0]].s);
  clearInterval(tick);tick=setInterval(updateTimer,250);updateTimer();
}
function remaining(){return Math.max(0,DURATION-(Date.now()-S.startAt))}
function updateTimer(){
  if(S.phase!=='exam')return;
  const r=remaining(),m=Math.floor(r/60000),s=Math.floor(r%60000/1000);
  const el=$('timer');el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  el.classList.toggle('warn',r<=5*60000&&r>60000);el.classList.toggle('crit',r<=60000);
  $('timebar').style.transform=`scaleX(${r/DURATION})`;
  if(r===0)timeUp();
}
function buildDots(){
  const wrap=$('dots');wrap.innerHTML='';
  SEC_ORDER.forEach(s=>{
    const ids=S.order.filter(id=>QM[id].s===s);if(!ids.length)return;
    const grp=document.createElement('div');grp.className='dgroup';grp.style.flex=ids.length;
    ids.forEach(id=>{const i=S.order.indexOf(id);const b=document.createElement('button');b.className='dot';b.dataset.i=i;b.innerHTML='<i></i>';b.setAttribute('aria-label','Question '+(i+1));b.addEventListener('click',()=>go(i));grp.appendChild(b)});
    wrap.appendChild(grp);
  });
  refreshDots();
}
function refreshDots(){
  document.querySelectorAll('.dot').forEach(d=>{const i=+d.dataset.i,q=QM[S.order[i]];const st=status(q);
    d.className='dot'+(st==='done'?' done':st==='partial'?' partial':'')+(S.flag[q.id]?' flag':'')+(i===S.cur?' cur':'')});
  const q=QM[S.order[S.cur]];
  $('flagBtn').classList.toggle('flagged',!!S.flag[q.id]);$('flagBtn').setAttribute('aria-pressed',!!S.flag[q.id]);
}
function changed(){save();refreshDots()}
function go(i,dir){
  if(i<0||i>=S.order.length)return;
  const from=QM[S.order[S.cur]].s,to=QM[S.order[i]].s;
  showQ(i,dir||(i>=S.cur?1:-1));
  if(to!==from&&!S.seen[to])interstitial(to);
}
function interstitial(sec){
  S.seen[sec]=true;save();
  const m=SECS[sec];const cnt=Q.filter(q=>q.s===sec);const pts=cnt.reduce((a,q)=>a+q.w,0);
  const v=document.createElement('div');v.className='veil';v.setAttribute('role','dialog');v.setAttribute('aria-label','Section '+m.n);
  v.innerHTML=`<div class="inter"><span class="mono">Section ${m.n} · ${m.floor}</span><h2 class="foil">${m.name}</h2><p>${m.topic}. ${cnt.length} questions, ${fmt(pts)} points.</p><span class="tap mono">Tap to continue</span></div>`;
  document.body.appendChild(v);
  const close=()=>{if(!v.isConnected)return;v.style.transition='opacity .3s';v.style.opacity=0;setTimeout(()=>v.remove(),300)};
  v.addEventListener('click',close);setTimeout(close,2200);
}
function showQ(i,dir,first){
  S.cur=i;save();
  const q=QM[S.order[i]],m=SECS[q.s];
  $('secChip').innerHTML=`<span class="mono" style="color:var(--muted)">${m.n} · </span><b>${m.name}</b>`;
  const card=$('qcard');
  card.className='qcard';void card.offsetWidth;card.className='qcard in'+(dir<0?' back':'');
  card.innerHTML=`<div class="qnum" aria-hidden="true">${String(i+1).padStart(2,'0')}</div>
    <div class="qmeta mono"><span>Question ${i+1} of ${S.order.length}</span><span class="kind">${KIND[q.t]}</span><span>${fmt(q.w)} ${q.w===1?'pt':'pts'}</span></div>
    <h2 class="prompt noselect">${esc(q.p)}</h2><p class="help">${esc(q.h||'')}</p><div class="body" id="qbody"></div>`;
  R[q.t](q,$('qbody'));
  $('prevBtn').disabled=i===0;
  $('nextBtn').querySelector('.lbl').textContent=i===S.order.length-1?'Finish':'Next';
  refreshDots();
  if(!first)scrollTo({top:0,behavior:reduce?'auto':'smooth'});
}
$('prevBtn').addEventListener('click',()=>go(S.cur-1,-1));
$('nextBtn').addEventListener('click',()=>{if(S.cur===S.order.length-1)openReview();else go(S.cur+1,1)});
$('flagBtn').addEventListener('click',()=>{const id=S.order[S.cur];S.flag[id]=!S.flag[id];if(!S.flag[id])delete S.flag[id];changed()});
$('mapBtn').addEventListener('click',openReview);

R.verdicts=(q,el)=>{
  const a=S.ans[q.id]||{};
  el.innerHTML=`<div class="verdicts">${q.items.map((it,i)=>`<div class="vrow"><p class="noselect">${esc(it.q)}</p><div class="seg" role="radiogroup" aria-label="Statement ${i+1}"><button data-i="${i}" data-v="1" aria-pressed="${a[i]===true}">TRUE</button><button data-i="${i}" data-v="0" aria-pressed="${a[i]===false}">FALSE</button></div></div>`).join('')}</div>`;

R.match=(q,el)=>{
  const rights=S.perm[q.id].map(id=>q.right.find(r=>r.id===id)).filter(Boolean);
  const L='ABCDEFGHIJKLMNOP';const letter=id=>L[rights.findIndex(r=>r.id===id)];
  let sel=null;
  const draw=()=>{
    const a=S.ans[q.id]||{};const usedBy={};Object.entries(a).forEach(([l,r])=>usedBy[r]=l);
    el.innerHTML=`<div class="match">
      <div class="mcol"><span class="mono">${q.flags?'Flags':'Items'}</span>${q.left.map((l,i)=>`<button class="mitem left ${sel&&sel.side==='L'&&sel.id===l.id?'sel':''}" data-id="${l.id}"><span class="tag">${i+1}</span><span class="mlabel">${q.flags?flagSVG(l.flag):esc(l.l)}</span><span class="slot ${a[l.id]?'filled':''}" data-clear="${a[l.id]?l.id:''}" aria-label="${a[l.id]?'Paired with '+letter(a[l.id])+'. Tap to clear':'Not paired'}">${a[l.id]?letter(a[l.id]):'—'}</span></button>`).join('')}</div>
      <div class="mcol"><span class="mono">Match to</span>${rights.map((r,k)=>`<button class="mitem right ${usedBy[r.id]?'used':''} ${sel&&sel.side==='R'&&sel.id===r.id?'sel':''}" data-id="${r.id}"><span class="tag">${L[k]}</span><span class="mlabel">${esc(r.l)}</span><span class="mono" style="color:var(--muted)">${usedBy[r.id]?'→ '+(q.left.findIndex(l=>l.id===usedBy[r.id])+1):''}</span></button>`).join('')}</div></div>`;
    el.querySelectorAll('.mitem').forEach(b=>b.addEventListener('click',e=>{
      const side=b.classList.contains('left')?'L':'R',id=b.dataset.id;

      if(sel&&sel.side!==side){const Lid=side==='L'?id:sel.id,Rid=side==='R'?id:sel.id;const ans=S.ans[q.id]||(S.ans[q.id]={});Object.keys(ans).forEach(k=>{if(ans[k]===Rid)delete ans[k]});ans[Lid]=Rid;sel=null;draw();changed();
        const s=el.querySelector(`.left[data-id="${Lid}"] .slot`);s&&s.classList.add('pop');return}
      sel=(sel&&sel.side===side&&sel.id===id)?null:{side,id};draw();
    }));
  };

};

function burst(){
  const cv=$('burst');cv.hidden=false;const ctx=cv.getContext('2d');const d=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);
  const cols=['#FFFFFF','#C4CCD9','#4C74F2','#E9EDF4'];
  const ps=range(140).map(()=>{const a=Math.random()*Math.PI*2,v=3+Math.random()*7;return{x:innerWidth/2,y:innerHeight*.38,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:2+Math.random()*4,n:Math.random()<.5?4:7,c:cols[Math.random()*4|0],rot:Math.random()*6,vr:(Math.random()-.5)*.2,life:1}});
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,innerWidth,innerHeight);let alive=false;
    for(const p of ps){p.vy+=.12;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.0055;if(p.life<=0)continue;alive=true;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.beginPath();
      for(let i=0;i<p.n*2;i++){const rr=i%2?p.r*(p.n===4?.3:.46):p.r;const a=-Math.PI/2+i*Math.PI/p.n;ctx.lineTo(rr*Math.cos(a),rr*Math.sin(a))}ctx.closePath();ctx.fill();ctx.restore()}
    if(alive&&t-t0<5000)requestAnimationFrame(f);else{cv.hidden=true}})(t0);
}

  if(!(+q.w>0))return 'Points must be more than zero.';
  switch(q.t){
    case 'mcq':if(q.o.filter(x=>x.trim()).length<2||q.o.some(x=>!x.trim()))return 'Fill in every option (at least two).';if(!(q.a>=0&&q.a<q.o.length))return 'Choose the correct option.';break;
    case 'multi':if(q.o.length<2||q.o.some(x=>!x.trim()))return 'Fill in every option (at least two).';if(!q.a.length)return 'Tick at least one correct option.';break;
    case 'typed':if(!q.accept.length)return 'Add at least one accepted answer.';break;
    case 'number':if(q.a===''||!isFinite(+q.a))return 'Enter the correct number.';break;
    case 'verdicts':if(!q.items.length||q.items.some(i=>!i.q.trim()))return 'Fill in every statement.';break;
    case 'match':if(q.left.length<2)return 'Add at least two pairs.';if(q.left.some(l=>!q.flags&&!String(l.l||'').trim())||q.right.some(r=>!r.l.trim()))return 'Fill in both sides of every pair and every trap.';break;
    case 'order':if(q.items.length<3)return 'Add at least three items.';break;
    case 'cloze':if(!blanks(q).length)return 'Put at least one answer in [square brackets].';break;
    case 'ledger':if(!q.rows.length||!blanks(q).length)return 'Add rows with at least one [gap].';break;
    case 'sort':if(q.buckets.some(b=>!b.trim()))return 'Name both groups.';if(q.items.length<2)return 'Add at least two items.';break;
  }
  return '';
}
function edRender(q,box,row,showPts){
  const opt=(t,i,checked)=>`<div class="optrow"><input type="${t}" name="c-${q.id}" data-c="${i}" ${checked?'checked':''} aria-label="Correct answer"><input class="input" data-o="${i}" value="${esc(q.o[i])}" placeholder="Option ${i+1}"><button class="x" data-rm="${i}" aria-label="Remove option">×</button></div>`;
  let body='';
  switch(q.t){
    case 'mcq':body=`<span class="mono lab">Options · select the correct one</span>${q.o.map((_,i)=>opt('radio',i,q.a===i)).join('')}<button class="addbtn" data-add>+ Add option</button>`;break;
    case 'multi':body=`<span class="mono lab">Options · tick every correct one</span>${q.o.map((_,i)=>opt('checkbox',i,q.a.includes(i))).join('')}<button class="addbtn" data-add>+ Add option</button><p class="ed-help">Wrong picks cost marks, so add believable traps.</p>`;break;
    case 'typed':body=`<label class="ed-f"><span class="mono">Accepted answers, one per line</span><textarea class="input" data-acc rows="3">${esc(q.accept.join('\n'))}</textarea></label><p class="ed-help">Capitals, spaces and punctuation are ignored, so "Dead-End" also accepts "dead end".</p>${tolBox()}`;break;
    case 'number':body=`<label class="ed-f" style="max-width:200px"><span class="mono">Correct number</span><input class="input" data-num inputmode="numeric" value="${esc(q.a)}"></label>`;break;
    case 'verdicts':body=`<span class="mono lab">Statements · set each as true or false</span>${q.items.map((it,i)=>`<div class="optrow vrow2"><input class="input" data-vq="${i}" value="${esc(it.q)}" placeholder="Statement"><div class="seg"><button data-vt="${i}" data-v="1" aria-pressed="${it.a===true}">TRUE</button><button data-vt="${i}" data-v="0" aria-pressed="${it.a===false}">FALSE</button></div><button class="x" data-rm="${i}" aria-label="Remove statement">×</button></div>`).join('')}<button class="addbtn" data-add>+ Add statement</button>`;break;
    case 'match':{
      const decoys=q.right.filter(r=>!q.left.some(l=>l.a===r.id));
      body=`<label class="inline-check"><input type="checkbox" data-flags ${q.flags?'checked':''}>Show flags on the left instead of text</label>
        <span class="mono lab">Correct pairs</span>${q.left.map((l,i)=>{const r=q.right.find(x=>x.id===l.a)||{l:''};return `<div class="optrow pair">${q.flags?`<select class="input" data-lf="${i}">${Object.keys(FLAG_NAMES).map(f=>`<option value="${f}" ${l.flag===f?'selected':''}>${FLAG_NAMES[f]} flag</option>`).join('')}</select>`:`<input class="input" data-ll="${i}" value="${esc(l.l||'')}" placeholder="Item">`}<span class="arrow">→</span><input class="input" data-lr="${i}" value="${esc(r.l)}" placeholder="Its match"><button class="x" data-rmp="${i}" aria-label="Remove pair">×</button></div>`}).join('')}
        <button class="addbtn" data-addp>+ Add pair</button>
        <span class="mono lab">Traps · extra options with no match</span>${decoys.map(d=>`<div class="optrow" style="grid-template-columns:1fr 34px"><input class="input" data-dc="${d.id}" value="${esc(d.l)}" placeholder="Trap option"><button class="x" data-rmd="${d.id}" aria-label="Remove trap">×</button></div>`).join('')}
        <button class="addbtn" data-addd>+ Add trap</button>`;break}
    case 'order':body=`<label class="ed-f"><span class="mono">Items in the correct order, one per line</span><textarea class="input" data-ord rows="${Math.max(4,q.items.length+1)}">${esc(q.items.join('\n'))}</textarea></label><p class="ed-help">Cubs see them shuffled. Each item in the right position earns its share of the points.</p>`;break;
    case 'cloze':body=`<label class="ed-f"><span class="mono">Sentence</span><textarea class="input code" data-cz rows="4">${esc(partsToSrc(q.parts))}</textarea></label><p class="ed-help">Put each answer in square brackets. List other accepted spellings with a bar, like <code>[gentlemen|gentleman]</code>. <span data-cnt></span></p>${tolBox()}`;break;
    case 'ledger':body=`<div class="twocol"><label class="ed-f"><span class="mono">First column heading</span><input class="input" data-col="0" value="${esc(q.cols[0])}"></label><label class="ed-f"><span class="mono">Second column heading</span><input class="input" data-col="1" value="${esc(q.cols[1])}"></label></div>
      <label class="ed-f"><span class="mono">Rows · first column | second column</span><textarea class="input code" data-ldg rows="${Math.max(5,q.rows.length+1)}">${esc(q.rows.map(r=>r[0]+' | '+partsToSrc(r[1])).join('\n'))}</textarea></label>
      <p class="ed-help">Put each gap in square brackets, like <code>2016/17 | Nathan "[Dead-End]" Nash</code>. <span data-cnt></span></p>${tolBox()}`;break;
    case 'sort':body=`<div class="twocol">${[0,1].map(b=>`<div class="ed-f"><span class="mono">Group ${b+1} name</span><input class="input" data-bn="${b}" value="${esc(q.buckets[b])}"><span class="mono" style="margin-top:6px">Items in this group, one per line</span><textarea class="input" data-bi="${b}" rows="6">${esc(q.items.filter(i=>i[1]===b).map(i=>i[0]).join('\n'))}</textarea></div>`).join('')}</div>`;break;
    case 'forgery':{const errs=FORGE[q.base];
      body=`<div class="twocol"><label class="ed-f"><span class="mono">Flag</span><select class="input" data-fb>${Object.keys(FORGE).map(f=>`<option value="${f}" ${q.base===f?'selected':''}>${FLAG_NAMES[f]}</option>`).join('')}</select></label>
        <label class="ed-f"><span class="mono">Planted mistake</span><select class="input" data-fe>${Object.entries(errs).map(([k,v])=>`<option value="${k}" ${q.err===k?'selected':''}>${v.l}</option>`).join('')}</select></label></div>
        <div class="ed-flag">${forgeOf(q).make(false)}</div><p class="ed-help">Correct tap: ${HIT_NAMES[forgeOf(q).hit].toLowerCase()}.</p>`;break}
    case 'builder':body=`<span class="mono lab">Set the correct flag</span><div class="builder" style="grid-template-columns:1fr 1fr"><div class="ed-flag">${composeFlag(q.a)}</div><div>${BCTRL.map(c=>`<div class="ctrl"><span class="mono">${c.l}</span><div class="seg">${c.o.map(([v,l])=>`<button data-bk="${c.k}" data-v="${v}" aria-pressed="${q.a[c.k]===v}">${l}</button>`).join('')}</div></div>`).join('')}</div></div>`;break;
  }
  function tolBox(){return `<label class="inline-check"><input type="checkbox" data-tol ${q.tol?'checked':''}>Forgive one typo in answers of six letters or more</label>`}
  box.innerHTML=`<div class="ed-grid">
      <label class="ed-f"><span class="mono">Question</span><textarea class="input" data-k="p" rows="2">${esc(q.p)}</textarea></label>
      <label class="ed-f"><span class="mono">Hint under the question (optional)</span><input class="input" data-k="h" value="${esc(q.h||'')}"></label>
      <div class="ed-row2"><label class="ed-f"><span class="mono">Section</span><select class="input" data-k="s">${SEC_ORDER.map(s=>`<option value="${s}" ${q.s===s?'selected':''}>${SECS[s].n} · ${SECS[s].name}</option>`).join('')}</select></label>
      <label class="ed-f"><span class="mono">Points</span><input class="input" type="number" min="0.5" step="0.5" data-k="w" value="${q.w}"></label></div>
    </div>
    <div class="ed-type">${body}</div>
    <p class="ed-err" role="alert"></p>
    <div class="ed-foot"><button class="btn sm" data-dup>Duplicate</button><button class="btn sm danger" data-del>Delete question</button></div>`;
  const $$=s=>box.querySelectorAll(s),$1=s=>box.querySelector(s);
  const rerender=()=>edRender(q,box,row,showPts);
  const check=()=>{const e=validate(q);$1('.ed-err').textContent=e;row.classList.toggle('bad',!!e)};
  const touch=()=>{markDirty();check()};
  const cnt=()=>{const c=$1('[data-cnt]');if(c){const n=blanks(q).length;c.textContent=n+(n===1?' gap found.':' gaps found.')}};
  // common
  $1('[data-k="p"]').addEventListener('input',e=>{q.p=e.target.value;row.querySelector('.ptxt').textContent=q.p||'(No question text yet)';touch()});
  $1('[data-k="h"]').addEventListener('input',e=>{q.h=e.target.value;touch()});
  $1('[data-k="w"]').addEventListener('input',e=>{q.w=Math.max(0,+e.target.value||0);showPts();renderTabsOnly();touch()});
  $1('[data-k="s"]').addEventListener('change',e=>{q.s=e.target.value;admTab=q.s;markDirty();renderAdmin()});
  const tol=$1('[data-tol]');tol&&tol.addEventListener('change',e=>{q.tol=e.target.checked?1:0;touch()});
  // type-specific
  if(q.t==='mcq'||q.t==='multi'){
    $$('[data-o]').forEach(i=>i.addEventListener('input',()=>{q.o[+i.dataset.o]=i.value;touch()}));
    $$('[data-c]').forEach(c=>c.addEventListener('change',()=>{const i=+c.dataset.c;if(q.t==='mcq')q.a=i;else q.a=c.checked?[...new Set([...q.a,i])].sort((x,y)=>x-y):q.a.filter(x=>x!==i);touch()}));
    $$('[data-rm]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.rm;if(q.o.length<=2)return;q.o.splice(i,1);if(q.t==='mcq'){if(q.a===i)q.a=0;else if(q.a>i)q.a--}else q.a=q.a.filter(x=>x!==i).map(x=>x>i?x-1:x);markDirty();rerender()}));
    $1('[data-add]').addEventListener('click',()=>{q.o.push('');markDirty();rerender();const ins=$$('[data-o]');ins[ins.length-1].focus()});
  }
  if(q.t==='typed')$1('[data-acc]').addEventListener('input',e=>{q.accept=lines(e.target.value);touch()});
  if(q.t==='number')$1('[data-num]').addEventListener('input',e=>{const v=e.target.value.trim();q.a=v===''?'':Number(v);touch()});
  if(q.t==='verdicts'){
    $$('[data-vq]').forEach(i=>i.addEventListener('input',()=>{q.items[+i.dataset.vq].q=i.value;touch()}));
    $$('[data-vt]').forEach(b=>b.addEventListener('click',()=>{q.items[+b.dataset.vt].a=b.dataset.v==='1';b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));touch()}));
    $$('[data-rm]').forEach(b=>b.addEventListener('click',()=>{if(q.items.length<=1)return;q.items.splice(+b.dataset.rm,1);markDirty();rerender()}));
    $1('[data-add]').addEventListener('click',()=>{q.items.push({q:'',a:true});markDirty();rerender()});
  }
  if(q.t==='match'){
    $1('[data-flags]').addEventListener('change',e=>{q.flags=e.target.checked;if(q.flags)q.left.forEach((l,i)=>{l.flag=l.flag||Object.keys(FLAG_NAMES)[i%3]});markDirty();rerender()});
    $$('[data-ll]').forEach(i=>i.addEventListener('input',()=>{q.left[+i.dataset.ll].l=i.value;touch()}));
    $$('[data-lf]').forEach(s=>s.addEventListener('change',()=>{q.left[+s.dataset.lf].flag=s.value;touch()}));
    $$('[data-lr]').forEach(i=>i.addEventListener('input',()=>{const l=q.left[+i.dataset.lr];const r=q.right.find(x=>x.id===l.a);if(r)r.l=i.value;touch()}));
    $$('[data-rmp]').forEach(b=>b.addEventListener('click',()=>{const l=q.left[+b.dataset.rmp];q.left.splice(+b.dataset.rmp,1);q.right=q.right.filter(r=>r.id!==l.a);markDirty();rerender()}));
    $1('[data-addp]').addEventListener('click',()=>{const rid=newId('r');q.right.push({id:rid,l:''});q.left.push({id:newId('l'),l:'',flag:q.flags?'antarctic':undefined,a:rid});markDirty();rerender()});
    $$('[data-dc]').forEach(i=>i.addEventListener('input',()=>{const r=q.right.find(x=>x.id===i.dataset.dc);if(r)r.l=i.value;touch()}));
    $$('[data-rmd]').forEach(b=>b.addEventListener('click',()=>{q.right=q.right.filter(r=>r.id!==b.dataset.rmd);markDirty();rerender()}));
    $1('[data-addd]').addEventListener('click',()=>{q.right.push({id:newId('r'),l:''});markDirty();rerender()});
  }
  if(q.t==='order')$1('[data-ord]').addEventListener('input',e=>{q.items=lines(e.target.value);touch()});
  if(q.t==='cloze'){$1('[data-cz]').addEventListener('input',e=>{q.parts=srcToParts(e.target.value);cnt();touch()});cnt()}
  if(q.t==='ledger'){
    $$('[data-col]').forEach(i=>i.addEventListener('input',()=>{q.cols[+i.dataset.col]=i.value;touch()}));
    $1('[data-ldg]').addEventListener('input',e=>{q.rows=lines(e.target.value).map(ln=>{const k=ln.indexOf('|');return k<0?['',srcToParts(ln)]:[ln.slice(0,k).trim(),srcToParts(ln.slice(k+1).trim())]});cnt();touch()});cnt();
  }
  if(q.t==='sort'){
    $$('[data-bn]').forEach(i=>i.addEventListener('input',()=>{q.buckets[+i.dataset.bn]=i.value;touch()}));
    $$('[data-bi]').forEach(t=>t.addEventListener('input',()=>{const b=+t.dataset.bi;q.items=[...q.items.filter(i=>i[1]!==b),...lines(t.value).map(n=>[n,b])].sort((x,y)=>x[1]-y[1]);touch()}));
  }
  if(q.t==='forgery'){
    $1('[data-fb]').addEventListener('change',e=>{q.base=e.target.value;q.err=Object.keys(FORGE[q.base])[0];if(/^This is meant to be the flag of the /.test(q.p))q.p=`This is meant to be the flag of the ${FLAG_NAMES[q.base]}, but one element is wrong. Tap the wrong element.`;row.querySelector('.ptxt').textContent=q.p;markDirty();rerender()});
    $1('[data-fe]').addEventListener('change',e=>{q.err=e.target.value;markDirty();rerender()});
  }
  if(q.t==='builder')$$('[data-bk]').forEach(b=>b.addEventListener('click',()=>{q.a[b.dataset.bk]=b.dataset.v;markDirty();rerender()}));
  // footer
  $1('[data-dup]').addEventListener('click',()=>{const c=clone(q);c.id=newId('q');draft.questions.splice(draft.questions.indexOf(q)+1,0,c);openId=c.id;markDirty();renderAdmin()});
  const del=$1('[data-del]');let armed=false;
  del.addEventListener('click',()=>{if(!armed){armed=true;del.classList.add('armed');del.textContent='Click again to delete';setTimeout(()=>{if(del.isConnected){armed=false;del.classList.remove('armed');del.textContent='Delete question'}},3000);return}
    draft.questions.splice(draft.questions.indexOf(q),1);openId=null;markDirty();renderAdmin()});
  check();
}

/* ---------- save / exit / restore ---------- */
$('admSave').addEventListener('click',async()=>{
  if(saving)return;
  const bad=draft.questions.find(q=>validate(q));
  if(bad){admTab=bad.s;openId=bad.id;renderAdmin();setStatus('Fix the highlighted question before saving.','bad');const r=$('admList').querySelector(`[data-id="${bad.id}"]`);r&&r.scrollIntoView({block:'center'});return}
  if(!draft.gate.q.trim()||!draft.gate.accept.length){setStatus('The exam password needs a question and at least one answer.','bad');$('gEditQ').focus();return}
  if(!dirty){setStatus('No changes to save.');return}
  saving=true;setStatus('Saving…');$('admSave').disabled=true;
  try{
    const r=await fetchJSON(API,{method:'PUT',headers:{'content-type':'application/json','x-admin-password':adminPw||''},body:JSON.stringify({v:2,questions:draft.questions,gate:draft.gate})},15000);
    if(r.ok){BANK={questions:clone(draft.questions),gate:clone(draft.gate)};dirty=false;resetExit();setStatus('Saved. Cubs who start the exam from now on get this version.','ok')}
    else setStatus(r.status===401?'Not saved. The admin password was changed; exit and sign in again.':r.status===413?'Not saved. The question bank is too large.':r.status===400?'Not saved. The server rejected the question bank as incomplete.':'Not saved. The server had a problem; try again.','bad');
  }catch(e){setStatus('Not saved. Check your connection and try again.','bad')}
  $('admSave').disabled=false;saving=false;
});
let exitArmed=false;
function resetExit(){exitArmed=false;$('admExit').textContent='Exit';$('admExit').classList.remove('danger','armed')}
$('admExit').addEventListener('click',()=>{
  if(dirty&&!exitArmed){exitArmed=true;const b=$('admExit');b.textContent='Discard changes?';b.classList.add('danger','armed');setTimeout(()=>{if(exitArmed)resetExit()},4000);return}
  resetExit();dirty=false;adminPw=null;exitAdmin();
});
holdable($('admRestore'),1800,()=>{draft={questions:clone(DEFAULT_Q),gate:clone(DEFAULT_GATE)};openId=null;markDirty();renderAdmin();setStatus('Original bank restored here. Save to use it for cubs.','dirty')});

/* ================= BOOT ================= */
if(S.phase==='exam'){useQ(S.bank||DEFAULT_Q);if(remaining()===0){submit(true);showResults(false)}else enterExam(false)}
else if(S.phase==='done'){useQ(S.bank||DEFAULT_Q);showResults(false)}
else{useQ(BANK.questions);refreshIntro()}
loadBank();
window.__exam={grade,get Q(){return Q},get S(){return S}};
})();
</script>
